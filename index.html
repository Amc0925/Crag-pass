<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crag Pass: Atlanta prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@600;700;800&family=Zilla+Slab:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var q=JSON.parse(localStorage.getItem("cragpass")||"{}");if(q.settings&&q.settings.theme)document.documentElement.setAttribute("data-theme",q.settings.theme)}catch(e){}</script>
<style>
:root{--bg:#89271e;--surface:#6f1f18;--ink:#fcc679;--muted:#89e3c6;--line:#d73525;--clay:#f8b16f;--stamp:#89e3c6;--pine:#89e3c6;--onpine:#6f1f18;--ban:linear-gradient(135deg,var(--clay),var(--stamp));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="sandstone"]{--bg:#1c1610;--surface:#2b2118;--ink:#cca20c;--muted:#bf9a63;--line:#8e6339;--clay:#cca20c;--stamp:#bf9a63;--pine:#bf9a63;--onpine:#1c1610;--ban:linear-gradient(135deg,#862810,#cca20c);color-scheme:dark}
:root[data-theme="rosewood"]{--bg:#fdfdfd;--surface:#e2c1b7;--ink:#354643;--muted:#7c444f;--line:#b4848e;--clay:#7c444f;--stamp:#7c444f;--pine:#354643;--onpine:#fdfdfd;--ban:linear-gradient(135deg,#b4848e,#354643);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 "Zilla Slab",Rockwell,Georgia,serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 110px}
h1,h2,h3{font-family:Rokkitt,Rockwell,"Roboto Slab",serif;margin:0;line-height:1.05}
h1{font-size:clamp(48px,13vw,76px);font-weight:700;letter-spacing:-.01em}
h2{font-size:28px;font-weight:700}
h3{font-size:21px;font-weight:600}
.sub{color:var(--muted);margin:6px 0 20px;max-width:46ch}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px}
.tabs button{font:600 17px Rokkitt,Rockwell,serif;background:none;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--clay)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.prog{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.prog b{font:700 56px/1 Rokkitt,Rockwell,serif;color:var(--clay)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--pine);transition:width .4s}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gym{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;gap:12px;align-items:center;min-height:128px}
.gym .txt{flex:1;min-width:0}
.gym p{margin:2px 0 10px;color:var(--muted);font-size:16px}
.slot{width:92px;height:92px;flex:none;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center}
.slot svg{width:100%;height:100%}
.fresh svg{animation:thump .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes thump{from{transform:scale(1.7);opacity:0}to{opacity:1}}
.btn{font:600 17px "Zilla Slab",Georgia,serif;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:4px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line);padding:5px 10px;font-size:16px}
.btn.on{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
form.card{display:grid;gap:10px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
label{display:grid;gap:3px;font-weight:600;font-size:16px}
input,select,textarea{font:400 18px "Zilla Slab",Georgia,serif;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;gap:8px;margin:18px 0 12px}
.chips button{font:600 17px "Zilla Slab",Georgia,serif;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.post{display:grid;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--muted);font-size:16px}
.tag{font-size:14px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted)}
.tag.out{color:var(--pine);border-color:var(--pine)}
.tag.priv{color:var(--clay);border-color:var(--clay)}
label .hint{font-weight:400}
.post footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:4px}
.author{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.author b{font-weight:600}
.author .nm{display:flex;align-items:center;gap:8px}
.author .hint{display:block}
.mono{font:700 20px Rokkitt,Rockwell,serif;color:var(--bg)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.note{margin-top:32px;font-size:15px;color:var(--muted);max-width:60ch}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.bottombar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottombar button{flex:1;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font:600 15px Rokkitt,Rockwell,serif;letter-spacing:.04em;padding:10px 16px;cursor:pointer}
.bottombar button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--clay)}
.bottombar button:focus-visible{outline:3px solid var(--stamp);outline-offset:-3px}
.avatar{border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;background:var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avrow{display:flex;gap:16px;align-items:center}
.avbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{margin:0;font-size:15px;color:var(--muted)}
.avbtns .hint{flex-basis:100%}
.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.gallery button{background:none;border:3px solid transparent;border-radius:50%;padding:2px;cursor:pointer}
.gallery button[aria-pressed="true"]{border-color:var(--ink)}
.gallery .avatar{width:100%;aspect-ratio:1}
.savebar{display:flex;gap:12px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pcard{padding:0;overflow:hidden}
.banner{height:clamp(96px,24vw,140px);background:var(--ban);overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.bnprev .banner{border-radius:6px;border:1px solid var(--line)}
.pbody{padding:0 16px 16px}
.phead{display:flex;align-items:flex-start;gap:14px;margin-top:-36px;margin-bottom:12px}
.pname{padding-top:44px;min-width:0}
.ring{border:4px solid var(--surface)}
.pname h2{font-size:32px}
.bio{margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center;display:grid;gap:2px}
.stat b{font:700 32px/1 Rokkitt,Rockwell,serif;color:var(--clay)}
.stat span{font-size:15px;color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-top:10px}
.minis svg{width:100%;height:auto;display:block}
.notice{background:var(--surface);border:1px solid var(--clay);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:16px}
.prow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.btn.danger{background:var(--clay);border-color:var(--clay);color:var(--bg)}
.tx{margin:8px 0;font-size:17px}
.stack{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#v-settings>h2,#v-friends>h2{margin-bottom:12px}
.themes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.theme{display:grid;gap:8px;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;font:600 18px "Zilla Slab",Georgia,serif}
.theme[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.sw{display:flex;gap:4px}
.sw i{flex:1;height:24px;border-radius:3px;border:1px solid rgba(128,128,128,.5)}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.frow .who{flex:1;min-width:0}
.frow b{font-weight:600;overflow-wrap:anywhere}
.frow .hint{display:block}
.fq{margin:6px 0 10px}
.linkrow{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.linkrow:hover b{text-decoration:underline}
.linkrow:focus-visible{outline:3px solid var(--stamp);outline-offset:3px;border-radius:6px}
@media (max-width:520px){form.card{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.fresh svg{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Crag Pass</h1>
  <p class="sub">Your climbing partner is out there. Go find them. Be the reason they send.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-board" aria-selected="true">Partner board</button>
    <button role="tab" id="t-pass" aria-selected="false">Passport</button>
  </div>
  <section id="v-board"></section>
  <section id="v-pass" hidden></section>
  <section id="v-profile" hidden></section>
  <section id="v-friends" hidden></section>
  <section id="v-settings" hidden></section>
  <p class="note">Prototype with sample data. Gym details come from public listings and need checking before launch. Your stamps and posts are saved in this browser only, so nobody else sees them yet.</p>
</main>
<nav class="bottombar" aria-label="Account">
  <button id="t-profile" aria-current="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Profile</span></button>
  <button id="t-friends" aria-current="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.8 3-6 6.5-6s6.5 2.2 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14c2.8 0 4.5 1.8 4.5 4.5"/></svg><span>Friends</span></button>
  <button id="t-settings" aria-current="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h8M20 6h-2M4 12h2M14 12h6M4 18h10M20 18h-2"/><circle cx="15" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg><span>Settings</span></button>
</nav>
<div class="toast" id="toast" role="status"></div>
<script>
var GYMS=[
{id:'crg-atl',n:'Central Rock Gym Atlanta',a:'3701 Presidential Pkwy (formerly Stone Summit)',c:'CRG'},
{id:'wall-crawler',n:'Wall Crawler Rock Club',a:'1522 DeKalb Ave NE',c:'WCR'},
{id:'atl-rocks',n:'Atlanta Rocks! Intown',a:'Atlanta',c:'ATR'},
{id:'overlook',n:'The Overlook Bouldering + Fitness',a:'Atlanta',c:'OVL'},
{id:'gt',n:'Georgia Tech Climbing Gym',a:'750 Ferst Dr NW',c:'GT'},
{id:'gsu',n:'Georgia State Climbing Wall',a:'Student Recreation Center, Piedmont Ave',c:'GSU'},
{id:'kennesaw',n:'Stone Summit Kennesaw',a:'Kennesaw',c:'SSK'},
{id:'escalade',n:'Escalade Indoor Rock Climbing',a:'Kennesaw',c:'ESC'}];
var CRAGS=[{id:'boat-rock',n:'Boat Rock',a:'Fulton County bouldering'},{id:'rocktown',n:'Rocktown',a:'Northwest Georgia bouldering'}];
var SEED=[
{id:'s1',place:'boat-rock',date:'2026-11-28',grades:'V2\u2013V5',note:'Bringing two pads. Looking for a spotter and someone who knows the Yellow Wall area.',by:'Maya',sample:1},
{id:'s2',place:'crg-atl',date:'2026-11-25',grades:'5.9\u20135.11',note:'Weeknight top-rope and lead. Need a belay partner after 6.',by:'Devon',sample:1},
{id:'s3',place:'rocktown',date:'2026-11-29',grades:'V3\u2013V6',note:'Day trip from Atlanta. Two carpool seats open.',by:'Priya',sample:1}];
var S={stamps:{},posts:[],joined:{}},filter='all',fresh=null;
try{var raw=localStorage.getItem('cragpass');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(x){}
var THEMES=[{id:'clay',n:'Red Clay',c:['#89271e','#fcc679','#f8b16f','#89e3c6','#d73525']},{id:'rosewood',n:'Rosewood',c:['#b4848e','#354643','#e2c1b7','#fdfdfd','#7c444f']},{id:'sandstone',n:'Sandstone',c:['#cca20c','#bf9a63','#8e6339','#862810','#1c1610']}];
function applyTheme(t){document.documentElement.setAttribute('data-theme',THEMES.some(function(x){return x.id===t})?t:'clay')}
applyTheme(S.settings&&S.settings.theme);
if(!S.uid)S.uid='d'+Math.random().toString(36).slice(2,10);
function save(){try{localStorage.setItem('cragpass',JSON.stringify(S));return localStorage.getItem('cragpass')!==null}catch(x){return false}}
function el(t,p){var n=document.createElement(t);p=p||{};for(var k in p){if(k==='text')n.textContent=p[k];else if(k==='on')for(var ev in p.on)n.addEventListener(ev,p.on[ev]);else n.setAttribute(k,p[k])}
for(var i=2;i<arguments.length;i++)if(arguments[i])n.appendChild(arguments[i]);return n}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function placeOf(id){return GYMS.concat(CRAGS).filter(function(g){return g.id===id})[0]||{n:'Unknown'}}
function isOut(id){return CRAGS.some(function(c){return c.id===id})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className='toast'},2200)}
var NS='http://www.w3.org/2000/svg';
function stampSvg(g,date,i){
var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 100 100');s.setAttribute('role','img');s.setAttribute('aria-label','Stamp for '+g.n);
s.style.transform='rotate('+((i*37)%24-12)+'deg)';s.style.color='var(--stamp)';
function add(t,a,txt){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);if(txt)n.textContent=txt;s.appendChild(n)}
add('circle',{cx:50,cy:50,r:46,fill:'none',stroke:'currentColor','stroke-width':3});
add('circle',{cx:50,cy:50,r:39,fill:'none',stroke:'currentColor','stroke-width':1.2});
add('text',{x:50,y:34,'text-anchor':'middle',fill:'currentColor','font-size':10,'font-family':'Rokkitt,serif','font-weight':700},'ATLANTA');
add('text',{x:50,y:60,'text-anchor':'middle',fill:'currentColor','font-size':g.c.length>3?24:30,'font-family':'Rokkitt,serif','font-weight':700},g.c);
add('text',{x:50,y:76,'text-anchor':'middle',fill:'currentColor','font-size':9,'font-family':'Rokkitt,serif','font-weight':600},new Date(date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}));
return s}
function renderPass(){
var v=document.getElementById('v-pass');v.textContent='';
var n=Object.keys(S.stamps).filter(function(k){return GYMS.some(function(g){return g.id===k})}).length;
v.appendChild(el('div',{class:'prog'},el('b',{text:n+' of '+GYMS.length}),el('span',{text:'gyms stamped'})));
var bar=el('div',{class:'bar'},el('i',{style:'width:'+(n/GYMS.length*100)+'%'}));v.appendChild(bar);
var grid=el('div',{class:'grid'});
GYMS.forEach(function(g,i){
var d=S.stamps[g.id];
var slot=el('div',{class:'slot'+(fresh===g.id?' fresh':'')});if(d){slot.style.borderStyle='solid';slot.style.borderColor='transparent';slot.appendChild(stampSvg(g,d,i))}
var btn=d?el('button',{class:'btn ghost',text:'Remove stamp',on:{click:function(){delete S.stamps[g.id];fresh=null;save();renderPass()}}})
:el('button',{class:'btn',text:'Stamp passport',on:{click:function(){S.stamps[g.id]=iso(new Date());fresh=g.id;save();renderPass();toast('Stamped '+g.n)}}});
grid.appendChild(el('div',{class:'gym'},el('div',{class:'txt'},el('h3',{text:g.n}),el('p',{text:g.a}),btn),slot))});
v.appendChild(grid)}
var ADJ=['Granite','Alpine','Crimson','Chalky','Steady','Sunny','Mossy','Windy','Rusty','Bold','Quiet','Swift'];
var NOUN=['Marmot','Falcon','Ibex','Otter','Pika','Heron','Lynx','Badger','Raven','Gecko','Bison','Fox'];
function hsh(t){var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}h^=h>>>15;h=Math.imul(h,2246822507)>>>0;h^=h>>>13;h=Math.imul(h,3266489909)>>>0;h^=h>>>16;return h>>>0}
function nick(seed){var h=hsh(seed);return ADJ[h%12]+' '+NOUN[Math.floor(h/12)%12]}
function anonAvatar(seed,size){
var d=el('div',{class:'avatar',style:'width:'+size+'px;height:'+size+'px;background:'+['var(--clay)','var(--stamp)','var(--ink)'][hsh(seed)%3]});
d.innerHTML='<svg viewBox="0 0 24 24" width="58%" height="58%" fill="var(--bg)" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z"/></svg>';return d}
function monoAvatar(name,size){
var d=el('div',{class:'avatar',style:'width:'+size+'px;height:'+size+'px;background:'+['var(--clay)','var(--stamp)','var(--ink)'][(name||'?').length%3]});
d.appendChild(el('span',{class:'mono',text:(name||'?').charAt(0).toUpperCase()}));return d}
var SAMPLE_USERS=[
{u:'maya_climbs',a:'Boulders at Boat Rock'},{u:'devon_sends',a:'Weeknights at Central Rock Gym'},{u:'priya_v4',a:'Day trips to Rocktown'},
{u:'atl_boulderer',a:'Intown gyms'},{u:'rocktown_rae',a:'Outdoor bouldering'},{u:'chalk_and_coffee',a:'Morning sessions'}];
var RESERVED=['admin','support','cragpass','crag_pass','moderator','climber','staff','help','official'];
var friendQ='';
function acctStep(){var P=S.profile;if(!P||!P.name)return'none';if(!P.username||!P.contact)return'details';if(!P.verified)return'verify';return'ok'}
function hasAcct(){return acctStep()==='ok'}
function contactWord(c){return c&&c.type==='phone'?'phone number':'email'}
function maskContact(c){if(!c)return'';if(c.type==='phone')return'*** *** '+c.value.slice(-4);var i=c.value.indexOf('@');return c.value.charAt(0)+'***'+c.value.slice(i)}
function checkContact(type,raw){raw=(raw||'').trim();
if(type==='phone'){var d=raw.replace(/[\s().-]/g,'');if(!/^\+?\d{10,15}$/.test(d))return{ok:false,msg:'Enter a valid phone number with area code.'};return{ok:true,value:d}}
var e=raw.toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))return{ok:false,msg:'Enter a valid email address.'};return{ok:true,value:e}}
var VER=null;
function newCode(){var a=new Uint32Array(1);crypto.getRandomValues(a);VER={code:String(100000+(a[0]%900000)),exp:Date.now()+600000,tries:0}}
function gateInfo(lead){var st=acctStep();
if(st==='none')return{text:lead+' Create your profile, add your email or phone number, and verify it.',label:'Create your profile',edit:true};
if(st==='details')return{text:'Finish your account: add a username and your email or phone number, then verify it.',label:'Finish your account',edit:true};
return{text:'Verify your '+contactWord(S.profile.contact)+' to finish your account.',label:'Verify now',edit:false}}
function userCheck(u,cur){
if(!u)return{ok:false,msg:'Choose a username.'};
if(!/^[a-z][a-z0-9_]{2,19}$/.test(u))return{ok:false,msg:'Use 3 to 20 characters: lowercase letters, numbers, and underscores, starting with a letter.'};
if(u!==cur&&(RESERVED.indexOf(u)>=0||SAMPLE_USERS.some(function(x){return x.u===u})))return{ok:false,msg:'That username is taken. Try another.'};
